name: LaTeX citation regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install LaTeX and PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra tex-gyre poppler-utils
      - name: Reproduce original defects and verify fixed PDFs
        run: |
          git show d95f401db1b9d01834325c5345ef651db16f2610:journalofnichenlp.cls > "$RUNNER_TEMP/original.cls"
          python3 tests/check-citations.py --baseline-class "$RUNNER_TEMP/original.cls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citation-regression
          path: build/
